<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Daily</title>
  <meta name="description" content="Three big AI, coding and reselling items a day. No filler.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Daily">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="row">
      <h1 id="date">AI Daily</h1>
      <span id="updated" class="muted"></span>
    </div>
    <div id="crypto" class="crypto" aria-label="Crypto prices"></div>
  </header>

  <nav class="chips" id="chips" aria-label="Categories"></nav>
  <nav class="chips llm" id="llmchips" aria-label="LLM filter" hidden></nav>

  <main id="picks" class="picks" aria-live="polite">
    <p class="muted loading">Loading…</p>
  </main>

  <section id="tip" class="card tip" hidden></section>

  <section id="week" class="week" hidden>
    <h2>Earlier this week</h2>
    <div id="weekdays"></div>
  </section>

  <footer class="muted small">
    <span id="status"></span>
    <a href="https://github.com/adrianskalvis/ai-daily">source</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
