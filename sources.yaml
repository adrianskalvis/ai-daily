# Sources for the daily build. Edit freely, no code changes needed.
#
# Fields
#   name      shown on the card
#   url       feed URL (rss / youtube / github_releases / gnews) or API base (hn)
#   type      rss | youtube | github_releases | gnews | hn | x (x is a stub, see README)
#   category  ai | code | mac | crypto | reselling | guides | auto (hn only: category by keywords)
#   tier      1 = official lab/vendor, 2 = solid secondary, 3 = search feed / filler
#   llm       optional, fixes the LLM tag: Claude GPT Gemini Grok Llama DeepSeek Mistral Qwen Other
#   min_points  hn only: ignore stories under this many points
#
# Tier drives the base score (see CONFIG in scripts/build.py).

sources:
